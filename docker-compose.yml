version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=cs421_user
      - DB_PASSWORD=securepassword123
      - DB_NAME=cs421_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=securepassword123
      - MYSQL_USER=cs421_user
      - MYSQL_PASSWORD=securepassword123
      - MYSQL_DATABASE=cs421_db
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  frontend1:
    image: cs421-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ID=frontend1
    ports:
      - "3002:3002"
    depends_on:
      - api
    networks:
      - app-network

  frontend2:
    image: cs421-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ID=frontend2
    ports:
      - "3003:3002"
    depends_on:
      - api
    networks:
      - app-network

  frontend3:
    image: cs421-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ID=frontend3
    ports:
      - "3004:3002"
    depends_on:
      - api
    networks:
      - app-network

  loadbalancer:
    image: cs421-loadbalancer
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - frontend1
      - frontend2
      - frontend3
      - api
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
