version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=cs421_user
      - DB_PASSWORD=securepassword123
      - DB_NAME=cs421_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=securepassword123
      - MYSQL_USER=cs421_user
      - MYSQL_PASSWORD=securepassword123
      - MYSQL_DATABASE=cs421_db
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
